<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Build Simulator</title>
<style>
/* ============================================================
   Build Simulator — The Build Simulator
   Single-file, config-driven, LTR English vibe-coding game.
   All game content lives in CONFIG (see <script>). The engine
   below is scenario-agnostic: new scenarios = pure config.
   ============================================================ */

:root{
  --bg:#0b1020;
  --bg-2:#0e1428;
  --panel:#141b31;
  --panel-2:#1b2340;
  --panel-3:#232d52;
  --line:#2a3560;
  --text:#eef2ff;
  --muted:#98a4c6;
  --muted-2:#6f7ba3;

  --green:#35d07f;   /* advance / small step */
  --blue:#4aa8ff;    /* discipline */
  --red:#ff5c6c;     /* setback / repair */
  --amber:#ffb547;   /* greedy / warning / comic */
  --purple:#b98cff;  /* vague */

  --green-dim:rgba(53,208,127,.14);
  --blue-dim:rgba(74,168,255,.14);
  --red-dim:rgba(255,92,108,.14);
  --amber-dim:rgba(255,181,71,.14);
  --purple-dim:rgba(185,140,255,.14);

  /* neutral prompt categories (NO good/bad valence) */
  --indigo:#8aa0ff;  --indigo-dim:rgba(138,160,255,.15);
  --teal:#3fd3c6;    --teal-dim:rgba(63,211,198,.15);
  --slate:#9aa4c6;

  --radius:16px;
  --radius-sm:11px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:"Segoe UI","Assistant","Heebo","Arial",system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  color:var(--text);
  background:
    radial-gradient(1100px 600px at 85% -10%, #182247 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 110%, #14224a 0%, transparent 55%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit}
::selection{background:rgba(74,168,255,.35)}

.wrap{max-width:1280px;margin:0 auto;padding:18px clamp(12px,3vw,28px) 40px}

/* ---------- shared bits ---------- */
.icon{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
/* prompt-category tags — neutral, describe SCOPE not correctness */
.tag.broad{background:var(--indigo-dim);color:var(--indigo)}
.tag.focused{background:var(--teal-dim);color:var(--teal)}

/* ============================================================
   START SCREEN
   ============================================================ */
.screen{animation:fadeUp .45s cubic-bezier(.2,.7,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.hero{
  text-align:center;padding:34px 18px 8px;max-width:820px;margin:0 auto;
}
.hero .kicker{color:var(--blue);font-weight:800;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.hero h1{
  font-size:clamp(34px,6.4vw,60px);line-height:1.02;margin:12px 0 6px;font-weight:900;
  background:linear-gradient(120deg,#fff 10%,#bcd0ff 55%,#8fb6ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .lead{color:var(--muted);font-size:clamp(15px,2.4vw,19px);line-height:1.55;margin:8px auto 0;max-width:640px}
.golden{
  display:inline-flex;gap:9px;align-items:center;margin-top:20px;
  background:linear-gradient(90deg,var(--amber-dim),transparent);
  border:1px solid rgba(255,181,71,.35);color:#ffe0a8;
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:14.5px;
}
.golden .icon{color:var(--amber)}

.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px auto 0;max-width:960px}
@media(max-width:760px){.setup-grid{grid-template-columns:1fr}}
.setup-card{
  background:linear-gradient(180deg,var(--panel),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 18px;
}
.setup-card h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.setup-card h3 .icon{color:var(--blue)}
.setup-card p.sub{margin:0 0 14px;color:var(--muted-2);font-size:13px}

.opt{
  width:100%;text-align:left;cursor:pointer;color:var(--text);
  background:var(--panel-2);border:1.5px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 15px;margin-top:10px;display:flex;gap:13px;align-items:flex-start;
  transition:.16s ease;
}
.opt:hover{border-color:var(--panel-3);background:var(--panel-3);transform:translateY(-1px)}
.opt.on{border-color:var(--blue);background:linear-gradient(180deg,var(--blue-dim),var(--panel-2));box-shadow:0 0 0 3px rgba(74,168,255,.13)}
.opt .oico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:19px;color:var(--blue);flex:none}
.opt .otxt b{display:block;font-size:15px;margin-bottom:2px}
.opt .otxt span{color:var(--muted);font-size:12.5px;line-height:1.45}
.opt.on .oico{color:#fff;background:var(--blue);border-color:var(--blue)}

.start-row{display:flex;justify-content:center;margin:28px 0 6px}
.btn-primary{
  cursor:pointer;border:none;border-radius:14px;padding:15px 34px;font-size:17px;font-weight:800;color:#08122b;
  background:linear-gradient(180deg,#7fd0ff,var(--blue));box-shadow:0 12px 30px rgba(74,168,255,.35);
  display:inline-flex;align-items:center;gap:10px;transition:.16s ease;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(74,168,255,.45)}
.btn-primary:active{transform:translateY(0)}
.btn-primary.green{background:linear-gradient(180deg,#7ff0b6,var(--green));box-shadow:0 12px 30px rgba(53,208,127,.32);color:#052616}
.how{max-width:760px;margin:14px auto 0;color:var(--muted-2);font-size:13px;text-align:center;line-height:1.6}

/* ============================================================
   GAME LAYOUT
   ============================================================ */
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--panel),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}
.topbar .brand .logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),#7fd0ff);color:#08122b}
.topbar .spacer{flex:1}
.goal-chip{
  display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:12px;padding:8px 13px;max-width:min(46vw,420px)
}
.goal-chip .icon{color:var(--green);font-size:17px;flex:none}
.goal-chip .gl{font-size:11px;color:var(--muted-2);font-weight:700}
.goal-chip .gt{font-size:13.5px;font-weight:700;line-height:1.2}
.turns-chip{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:7px 14px 7px 8px}
.turns-num{font-size:28px;font-weight:900;line-height:1;min-width:34px;text-align:center;color:var(--text);font-variant-numeric:tabular-nums}
.turns-chip.low .turns-num{color:var(--amber)}
.turns-chip.crit .turns-num{color:var(--red)}
.turns-chip .tl{font-size:11px;color:var(--muted-2);font-weight:700;line-height:1.15}
.turns-chip .bolt{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--amber);font-size:18px}
.mode-tag{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
.mode-tag.team{background:var(--green-dim);color:var(--green)}
.mode-tag.board{background:var(--amber-dim);color:var(--amber)}
.ghost-btn{cursor:pointer;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
  border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;display:inline-flex;gap:7px;align-items:center;transition:.15s}
.ghost-btn:hover{color:var(--text);border-color:var(--panel-3);background:var(--panel-3)}

.board-banner{
  display:none;align-items:center;gap:10px;margin-bottom:14px;
  background:linear-gradient(90deg,var(--amber-dim),transparent);
  border:1px solid rgba(255,181,71,.3);border-radius:12px;padding:9px 15px;color:#ffe0a8;font-weight:700;font-size:14px
}
body.board .board-banner{display:flex}
.board-banner .icon{color:var(--amber)}

.game{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px;align-items:start}
@media(max-width:900px){.game{grid-template-columns:1fr}}

/* ---------- app pane (phone) ---------- */
.phone-col{position:sticky;top:14px}
@media(max-width:900px){.phone-col{position:static}}
.phone{
  width:100%;max-width:360px;margin:0 auto;
  background:linear-gradient(180deg,#20263e,#171c30);
  border-radius:38px;padding:12px;border:1px solid #313a5f;
  box-shadow:var(--shadow), inset 0 0 0 2px rgba(255,255,255,.02);
}
.phone .notch{width:120px;height:22px;background:#0b0f1d;border-radius:0 0 14px 14px;margin:0 auto 6px}
.screen-frame{
  position:relative;background:#f6f7fb;border-radius:28px;overflow:hidden;
  height:min(560px,64vh);min-height:420px;display:flex;flex-direction:column;
  color:#1b2340;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
}
.screen-frame.animating .app-screen{animation:screenIn .42s cubic-bezier(.2,.75,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.screen-tick{height:30px;background:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:12px;color:#6b7591;border-bottom:1px solid #eef0f6;font-weight:700}
.app-screen{flex:1;overflow:auto;display:flex;flex-direction:column}
.tested-flag{
  position:absolute;top:38px;inset-inline-start:10px;z-index:5;
  background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;
  display:none;align-items:center;gap:5px;box-shadow:0 6px 16px rgba(255,92,108,.4)
}
.screen-frame.show-test .tested-flag{display:inline-flex}

/* discipline bar under phone */
.disc-bar{margin:14px auto 0;max-width:360px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.disc-btn{
  cursor:pointer;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
  padding:11px 6px 9px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s;text-align:center
}
.disc-btn:hover:not(:disabled){border-color:var(--blue);background:var(--blue-dim);transform:translateY(-2px)}
.disc-btn:disabled{opacity:.4;cursor:not-allowed}
.disc-btn .icon{font-size:20px;color:var(--blue)}
.disc-btn b{font-size:13px}
.disc-btn small{font-size:10.5px;color:var(--muted-2);font-weight:700}
.save-slot{
  margin:12px auto 0;max-width:360px;background:var(--panel-2);border:1px dashed var(--line);
  border-radius:12px;padding:10px 13px;display:flex;align-items:center;gap:11px;font-size:13px
}
.save-slot .sico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--muted-2)}
.save-slot.has .sico{color:var(--blue);border-color:rgba(74,168,255,.5);background:var(--blue-dim)}
.save-slot .sl{color:var(--muted-2);font-weight:700;font-size:11px}
.save-slot .sn{font-weight:800}

/* ---------- prompt pane ---------- */
.prompt-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.prompt-head h2{margin:0;font-size:19px;font-weight:900}
.prompt-head .hint{color:var(--muted-2);font-size:13px}
.reveal{
  margin:12px 0 16px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);
  background:var(--panel-2);display:flex;gap:12px;align-items:flex-start;min-height:20px;
  animation:fadeUp .4s ease
}
.reveal .ric{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:18px}
/* reveals are AFTER the choice — coloring by outcome here is fine (not a pre-choice tell) */
.reveal.advance{border-color:rgba(53,208,127,.4)}.reveal.advance .ric{background:var(--green-dim);color:var(--green)}
.reveal.setback{border-color:rgba(255,92,108,.45)}.reveal.setback .ric{background:var(--red-dim);color:var(--red)}
.reveal.discipline{border-color:rgba(74,168,255,.42)}.reveal.discipline .ric{background:var(--blue-dim);color:var(--blue)}
.reveal .rtxt{font-size:14.5px;line-height:1.5}
.reveal .rtxt .lesson{display:block;margin-top:6px;color:var(--muted);font-size:13px;font-style:italic}
.reveal.placeholder{border-style:dashed;color:var(--muted-2)}
.reveal.placeholder .ric{background:var(--panel);color:var(--muted-2)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
body.board .cards{grid-template-columns:1fr}
.card{
  cursor:pointer;text-align:left;color:var(--text);position:relative;
  background:linear-gradient(180deg,var(--panel),var(--bg-2));
  border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 16px 15px;
  transition:.16s ease;overflow:hidden;display:flex;flex-direction:column;gap:9px
}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line)}
/* accent bar = neutral scope category, carries no good/bad meaning */
.card.broad::before{background:var(--indigo)} .card.focused::before{background:var(--teal)}
.card:hover{transform:translateY(-3px);border-color:var(--panel-3);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.card:hover.broad{border-color:rgba(138,160,255,.55)}
.card:hover.focused{border-color:rgba(63,211,198,.55)}
.card .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .promptline{display:flex;gap:9px;align-items:flex-start}
.card .qico{color:var(--muted-2);font-size:16px;margin-top:2px;flex:none}
.card .lbl{font-size:15px;font-weight:700;line-height:1.4}
/* factual "asks for" line — describes scope, not correctness */
.card .asks{display:flex;gap:7px;align-items:flex-start;color:var(--slate);font-size:12.5px;font-weight:600;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;line-height:1.4}
.card .asks .icon{font-size:14px;margin-top:1px;flex:none;color:var(--muted-2)}
body.board .card .asks{font-size:13.5px}
.card .cost{font-size:11.5px;color:var(--muted-2);font-weight:800;display:inline-flex;align-items:center;gap:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 8px;flex:none}
body.board .card{padding:20px}
body.board .card .lbl{font-size:17px}
.vote-badge{display:none}
body.board .vote-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:4px;color:var(--amber);font-weight:800;font-size:12.5px
}

/* ============================================================
   MOCK APP STYLES (scoped to .app-screen) — reusable by config
   ============================================================ */
.app-screen{font-family:var(--font);font-size:14px}
.app-screen .a-pad{padding:16px}
.app-screen .a-head{padding:16px 16px 10px}
.app-screen .a-logo{font-size:19px;font-weight:900;color:#111a3a;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.app-screen .a-logo .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#4aa8ff,#7fd0ff)}
.app-screen .a-sub{color:#7b86a6;font-size:12.5px;margin-top:3px}
.app-screen .a-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
  background:linear-gradient(180deg,#5ab0ff,#2f7fe0);color:#fff;border:none;border-radius:12px;
  padding:13px;font-weight:800;font-size:15px;font-family:inherit;box-shadow:0 8px 18px rgba(47,127,224,.3)
}
.app-screen .a-btn.ghost{background:#eef1f9;color:#38507e;box-shadow:none}
.app-screen .a-chip{display:inline-block;background:#eef1f9;color:#48587f;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0}
.app-screen .a-card{background:#fff;border:1px solid #e9ecf5;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 4px 12px rgba(20,30,60,.05)}
.app-screen .a-card .t{font-weight:800;color:#1a244a;font-size:14.5px}
.app-screen .a-card .d{color:#7b86a6;font-size:12.5px;margin-top:3px}
.app-screen .a-field{background:#fff;border:1.5px solid #e3e7f2;border-radius:11px;padding:12px;color:#9aa4bd;font-size:13.5px;margin-bottom:10px}
.app-screen .a-label{font-weight:800;font-size:13px;color:#33406a;margin:2px 2px 7px}
.app-screen .a-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#aab2c9;padding:30px;text-align:center}
.app-screen .a-empty .big{width:66px;height:66px;border-radius:18px;background:#eef1f9;display:grid;place-items:center;color:#c2cadd}
.app-screen .a-empty .big .icon{font-size:30px}
.app-screen .a-empty b{color:#7b86a6;font-weight:800;font-size:14px}
.app-screen .a-empty span{font-size:12.5px}
.app-screen .a-nav{margin-top:auto;display:flex;border-top:1px solid #eef0f6;background:#fff}
.app-screen .a-nav div{flex:1;text-align:center;padding:9px 0 8px;color:#aab2c9;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.app-screen .a-nav div .icon{font-size:18px}
.app-screen .a-nav div.on{color:#2f7fe0}
.app-screen .a-toast{background:#e6f8ef;color:#177a4b;border:1px solid #b6e6cd;border-radius:11px;padding:10px 12px;font-weight:700;font-size:13px;margin:0 16px 12px;display:flex;gap:8px;align-items:center}
/* glitch / broken helpers */
.app-screen .a-glitch{position:relative}
.app-screen .a-broken{background:#fff4f5;border:1px dashed #ffb3bb;color:#c23b48}
.app-screen .a-overlap{position:relative}
.app-screen .a-overlap .a-btn{position:relative}
.app-screen .a-overlap .a-btn:nth-child(2){transform:translate(6px,-8px) rotate(-1.5deg);opacity:.96}
.app-screen .a-overlap .a-btn:nth-child(3){transform:translate(-8px,-18px) rotate(2deg);opacity:.9}
.app-screen .a-warn{background:#fff7e8;color:#a5701a;border:1px solid #ffe0a8;border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-bottom:10px;display:flex;gap:7px;align-items:flex-start}
.app-screen .a-dead{color:#b9c0d2 !important;pointer-events:none}
.app-screen .a-messy .a-card{transform:rotate(-.6deg)}
.app-screen .a-messy .a-card:nth-child(even){transform:rotate(.7deg) translateX(4px)}
.app-screen .a-ugly .a-logo{color:#d14bd1;text-shadow:1px 1px 0 #ffd0ff}
.app-screen .a-ugly{background:repeating-linear-gradient(45deg,#fff,#fff 10px,#fbf0ff 10px,#fbf0ff 20px)}

/* ============================================================
   END SCREEN
   ============================================================ */
.end{max-width:900px;margin:0 auto}
.end-head{text-align:center;padding:16px 10px 4px}
.end-head .rico{width:74px;height:74px;border-radius:22px;display:inline-grid;place-items:center;font-size:38px;margin-bottom:6px}
.end-head.win .rico{background:var(--green-dim);color:var(--green)}
.end-head.lose .rico{background:var(--red-dim);color:var(--red)}
.end-head h1{font-size:clamp(26px,5vw,40px);margin:6px 0 4px;font-weight:900}
.end-head p{color:var(--muted);font-size:16px;margin:0}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-top:16px}
.panel h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.panel h3 .icon{color:var(--blue)}
.panel .psub{color:var(--muted-2);font-size:13px;margin:0 0 14px}

/* turn-history map */
.map{display:flex;flex-wrap:wrap;gap:9px}
.map .step{
  flex:1 1 132px;min-width:120px;border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel-2);
  display:flex;gap:10px;align-items:flex-start;position:relative
}
.map .step .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none;color:#08122b}
.map .step.advance{border-color:rgba(53,208,127,.4)} .map .step.advance .n{background:var(--green)}
.map .step.setback{border-color:rgba(255,92,108,.4)} .map .step.setback .n{background:var(--red)}
.map .step.discipline{border-color:rgba(74,168,255,.4)} .map .step.discipline .n{background:var(--blue)}
.map .step .delta{font-weight:900;font-size:11px;margin-inline-start:6px}
.map .step.advance .delta{color:var(--green)} .map .step.setback .delta{color:var(--red)} .map .step.discipline .delta{color:var(--muted-2)}
.map .step .st{font-size:12px;font-weight:700;line-height:1.3}
.map .step .sc{font-size:10.5px;color:var(--muted-2);font-weight:800;margin-top:3px}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.map-legend .g{background:var(--green)}.map-legend .r{background:var(--red)}.map-legend .b{background:var(--blue)}

.tally{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.tally .t{flex:1 1 120px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tally .t .num{font-size:26px;font-weight:900;line-height:1}
.tally .t.g .num{color:var(--green)}.tally .t.r .num{color:var(--red)}.tally .t.b .num{color:var(--blue)}
.tally .t .lb{color:var(--muted);font-size:12.5px;font-weight:700;margin-top:3px}

.progbar{height:14px;border-radius:999px;background:var(--panel-3);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7ff0b6);border-radius:999px;transition:width .8s cubic-bezier(.2,.7,.3,1)}
.prog-lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px;font-weight:700}

.payoff{background:linear-gradient(120deg,var(--green-dim),transparent);border:1px solid rgba(53,208,127,.35);color:#c8f7de}
.payoff h3 .icon{color:var(--green)}
.debrief-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.debrief-list li{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:14.5px;display:flex;gap:11px;align-items:flex-start}
.debrief-list li .qm{color:var(--purple);font-weight:900;font-size:18px;flex:none;line-height:1.2}
.handoff{background:linear-gradient(120deg,var(--blue-dim),transparent);border:1px solid rgba(74,168,255,.4);text-align:center;font-size:16px;line-height:1.55;font-weight:600}
.handoff .icon{color:var(--blue)}
.end-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0 4px}

.hidden{display:none !important}
.foot{text-align:center;color:var(--muted-2);font-size:12px;margin-top:26px}
</style>
</head>

<script>
"use strict";
/* svg helper */
function ic(id){return '<svg class="icon" aria-hidden="true"><use href="#i-'+id+'"/></svg>';}

/* ============================================================
   CONFIG — THE ENTIRE GAME LIVES HERE.
   To make a new scenario: add an object to CONFIG.scenarios.
   Engine below never needs to change.
   ------------------------------------------------------------
   state:  { id, name, progress(0-100), looksFine, mock(HTML),
             testReveal, choices:[...] }
   choice: { label, type:'small'|'greedy'|'vague',
             to, cost=1, reveal, lesson?, comicBeat?, outcome? }
     outcome (for the end-screen map) is inferred from type when
     omitted: small->advance, greedy/vague->repair. Set it
     explicitly for "small repair" steps (untangling) => 'repair'.
   Discipline moves (save / test / restore) are engine-level and
   available every turn from the bar under the phone.
   ============================================================ */
const CONFIG = {
  meta:{
    title:"Build Simulator",
    kicker:"Entrepreneurship Camp · Building with AI",
    lead:"You're a team building an app with AI. Each turn you pick the next prompt — and the screen changes based on what you asked for. The goal: reach a working first screen before you run out of turns.",
    golden:"The golden rule: at the start — give full context all at once. Once something works — a focused step, a test, a save.",
    turns:9,
    disciplineCost:1
  },
  ui:{
    turnsLabel:"turns left", goalLabel:"Goal",
    save:"Save version", saveSub:"Save current state",
    test:"Test what works", testSub:"Expose hidden bugs",
    restore:"Restore version", restoreSub:"Go back to saved state",
    slotEmpty:"No saved version", slotLabel:"Saved version",
    promptTitle:"What's your next prompt?",
    promptHint:"Read and decide — the right choice depends on the build stage, not on the card type. Every choice costs a turn.",
    revealPlaceholder:"Pick a prompt and the AI will build. What happens will show up here.",
    boardBanner:"Class / Board mode — the class votes by show of hands, the facilitator clicks the winning card.",
    voteHint:"Vote by raising hands",
    costTurn:"turn",
    testGenericFine:"You tested — everything seems to work. Sometimes a test just confirms you're on track. It still cost one turn.",
    saveDone:"Saved. One turn now — insurance for everything that comes next. If something breaks, you can come back here in one turn.",
    restoreDone:"You went back to the saved version. Everything that broke since then — gone. One turn, not three.",
    restoreNone:"There's no saved version to go back to. Saving is what turns 'broken' into one turn instead of three.",
    winTitle:"You reached a working first screen!",
    winSub:"You built an app that works — step by step.",
    loseTitle:"Not this time", loseSub:"You ran out of turns — but look how close you got, and where your turns leaked away.",
    mapTitle:"Turn Map", mapSub:"Every turn you took — green=progress, red=repair/waste, blue=discipline. This is where you can see where your turns leaked.",
    progTitle:"How close you got to the goal",
    payoffTitle:"What you did",
    payoff:"You worked like a team building with AI — full context at the start, then a focused step, a test and a save. You learned that the right prompt depends on the stage: what wins at the start breaks things at the end. That's exactly the process you'll use in a moment on your own real app.",
    debriefTitle:"Wrap-up discussion (out loud, no typing)",
    debrief:[
      "When is it worth asking for a lot at once — and when is one small, focused step better?",
      "Which choice cost you the most — and what will you do differently in the real build?",
      "When is it worth 'wasting' a turn on saving or testing?"
    ],
    handoffTitle:"The next step — for real",
    handoff:"Now we open the real tool. Same rules: at the start, give full context and ask for a lot; once something works — a focused step, test, save.",
    replay:"Play again", switchScenario:"Another scenario", newGame:"New game",
    turnsUsed:"Turns used", advances:"Progress", repairs:"Repairs/waste", discipline:"Discipline moves"
  },

  scenarios:[
    /* ========================================================
       SCENARIO 1 — CoolSpot  (default)
       ======================================================== */
    {
      id:"magniv-li",
      appName:"CoolSpot",
      tagline:"An app where teens recommend free, cool leisure activities to each other.",
      icon:"heart",
      goalStateId:"first-screen-working",
      goalText:"A working home screen with one core action: suggest an activity",
      startStateId:"empty",
      states:[
        /* ---------- SCAFFOLD PHASE: broad+specified is the fast, correct move;
             broad+vague is the trap; focused works but is slower ---------- */
        {
          id:"empty", name:"Empty screen", progress:0, looksFine:true,
          testReveal:"Nothing to test yet — the screen is empty. But it's a good habit. Cost one turn.",
          mock:`<div class="a-empty"><div class="big">${ic('screen')}</div><b>Empty screen</b><span>You haven't asked the AI for anything yet</span></div>`,
          choices:[
            {scope:"broad", style:"specified", outcome:"advance", to:"scaffold-rich",
             label:"Build a complete first screen: a 'CoolSpot' title, a sample list of activities, and a 'Suggest an activity' button that opens a form to add one — all on one screen.",
             asksFor:"Asks for: a full screen, with details of what each part does",
             reveal:"A rich, clear first prompt — and in one turn the AI built an almost complete screen. At the start, when there's nothing to break yet, the more context you give, the more you get at once.",
             lesson:"At the start of a build — full context is your biggest advantage. A lot got built just now; it's also worth testing that it all really works."},
            {scope:"broad", style:"vague", outcome:"setback", to:"everything-half", comicBeat:true,
             label:"Build the whole app: home, list, profile and chat — everything, however you like.",
             asksFor:"Asks for: 4 screens, without saying what each one does",
             reveal:"Broad isn't the problem — you didn't say what each part does or how they connect, so the AI made big guesses. Now there are three 'Send' buttons, each doing something different, and the profile opens inside the chat.",
             revealPlain:"Another broad prompt with no details — the AI made big guesses and everything came out half-done. Broad without context = chaos, not magic.",
             lesson:"The difference between a winning first prompt and a messy one isn't size — it's detail."},
            {scope:"focused", style:"specified", outcome:"advance", to:"home-title",
             label:"Build just a 'CoolSpot' title with a short explanation sentence.",
             asksFor:"Asks for: one thing, clearly defined",
             reveal:"It works — clean and precise. But on the first turn, when there's nothing to protect yet, you could have asked for much more at once. Small steps will really shine later, when there's something to protect.",
             lesson:"A small step is a great tool — just not the most efficient opening move."},
            {scope:"focused", style:"vague", outcome:"setback", to:"pretty-mess",
             label:"Make it look nice and cool.",
             asksFor:"Asks for: 'nice', without saying what exactly",
             reveal:"'Nice' isn't an instruction. The AI guessed: it painted the empty screen with pink stripes and added a giant title. Nice? Doubtful. Useful? Not at all.",
             lesson:"Vague invites the AI to guess — and usually not what you imagined."}
          ]
        },
        {
          id:"home-title", name:"Home — title", progress:15, looksFine:true,
          testReveal:"You tested: the title displays nicely, the screen loads. Everything's fine here. Cost one turn.",
          mock:`<div class="a-head"><div class="a-logo"><span class="dot"></span>CoolSpot</div><div class="a-sub">Recommend free leisure activities in your neighborhood</div></div>
                <div class="a-empty"><div class="big">${ic('heart')}</div><b>No recommendations yet</b><span>A button to suggest an activity is coming soon</span></div>`,
          choices:[
            {scope:"broad", style:"specified", outcome:"advance", to:"scaffold-rich",
             label:"Now build the rest of the screen: a sample list of activities and a 'Suggest an activity' button that opens an add form.",
             asksFor:"Asks for: several parts together, with details",
             reveal:"Still in the scaffold stage — and there's nothing to break. The broad, detailed prompt jumped you forward all at once. This is exactly the time to think big.",
             lesson:"As long as you're setting up the scaffold — broad, detailed context is the fast way."},
            {scope:"focused", style:"specified", outcome:"advance", to:"home-button",
             label:"Add a 'Suggest an activity' button under the title.",
             asksFor:"Asks for: one thing, clearly defined",
             reveal:"One button added, in the right place. It works — but again you spent a whole turn on a small step, when you could have asked for more.",
             lesson:"Precise always works; just think about how much you can ask for at once at this stage."},
            {scope:"broad", style:"vague", outcome:"setback", to:"everything-half",
             label:"Just build everything already — list, profile, chat, whatever.",
             asksFor:"Asks for: lots of screens, without details",
             reveal:"Broad again with no context. The list, profile and chat got crammed on top of each other, and the title that worked vanished under the pile.",
             lesson:"Broad without details gets tangled — even with what already worked."}
          ]
        },
        {
          id:"home-button", name:"Home — button", progress:30, looksFine:true,
          testReveal:"You tested: you clicked 'Suggest an activity' — the button responds and highlights. It doesn't open anything yet, because you didn't start on that. All as expected. Cost one turn.",
          mock:`<div class="a-head"><div class="a-logo"><span class="dot"></span>CoolSpot</div><div class="a-sub">Recommend free leisure activities in your neighborhood</div></div>
                <div class="a-pad" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px">
                  <div class="a-empty" style="padding:10px"><div class="big">${ic('heart')}</div><b>No recommendations yet</b><span>Be the first to suggest an activity</span></div>
                  <button class="a-btn">${ic('plus')} Suggest an activity</button>
                </div>`,
          choices:[
            {scope:"focused", style:"specified", outcome:"advance", to:"home-form",
             label:"Make the button open a short form: activity name + where.",
             asksFor:"Asks for: one behavior, clearly defined",
             reveal:"The button now opens a clean form: 'Activity name' and 'Where'. Exactly what you asked for.",
             lesson:"One behavior for one button — a precise step."},
            {scope:"broad", style:"specified", outcome:"advance", to:"scaffold-rich",
             label:"Now build the form and the list together: an add form that opens from the button, and a list that shows activities.",
             asksFor:"Asks for: two parts together, with details",
             reveal:"Still scaffolding, still detailed — so going broad paid off. You got a form and a list at once and jumped forward.",
             lesson:"While setting up the scaffold, you can bundle several parts into one detailed prompt."},
            {scope:"focused", style:"vague", outcome:"setback", to:"vague-moved",
             label:"Make the button stand out more and look more inviting.",
             asksFor:"Asks for: 'stand out', without saying how",
             reveal:"The AI guessed what 'stand out' means: it made the button bigger, wrote 'CLICK!!!' on it, and along the way moved it above the title. Something that worked — moved.",
             lesson:"Vague changes things you didn't ask to change."}
          ]
        },
        {
          /* HIDDEN BREAKAGE: pretty form, submits nowhere. Only test reveals it. */
          id:"home-form", name:"Home — form", progress:45, looksFine:false,
          testReveal:"The test exposed a hidden bug: you filled in the form, clicked 'Send' — and nothing happened. The form looks nice but isn't connected to anything. Good thing you tested now, before building on top of it. Cost one turn.",
          mock:`<div class="a-head"><div class="a-logo"><span class="dot"></span>CoolSpot</div></div>
                <div class="a-pad"><div class="a-label">Activity name</div><div class="a-field">e.g. Basketball in the park</div>
                <div class="a-label">Where?</div><div class="a-field">Place name / address</div>
                <button class="a-btn">${ic('check')} Send</button></div>`,
          choices:[
            {scope:"focused", style:"specified", outcome:"advance", to:"core-working",
             label:"Connect the form: after 'Send' — save the activity and show it in the list.",
             asksFor:"Asks for: one precise fix",
             reveal:"Now 'Send' actually does something: the activity is saved and shows up in the list. That's the step that held everything together.",
             lesson:"Now that there's a base — the focused, precise step is the winner."},
            {scope:"focused", style:"specified", outcome:"setback", to:"list-cosmetic-broken",
             label:"Add more sample activities to the list so the screen looks full and impressive.",
             asksFor:"Asks for: one thing, clearly defined",
             reveal:"Looks like progress — but you added content on top of a form that doesn't save anything. Now the list is full of fake activities, and you can't really add to them.",
             lesson:"A test would have shown the form was dead — and saved you from building on top of it."},
            {scope:"broad", style:"specified", outcome:"advance", to:"core-working",
             label:"Connect everything: the form saves, the list shows what was saved, and a confirmation appears — with details of what happens at each step.",
             asksFor:"Asks for: several parts, with full details",
             reveal:"Nothing was connected yet that could break, so the detailed broad prompt worked — the form, list and confirmation were wired together. This is the last time broad is safe here.",
             lesson:"Once you have an action that works — a broad prompt starts putting it at risk."},
            {scope:"focused", style:"vague", outcome:"setback", to:"vague-moved",
             label:"Make the form prettier.",
             asksFor:"Asks for: 'pretty', without details",
             reveal:"The AI padded it with colors, and along the way hid the 'Send' button under a field. Now you can't send at all — and it wasn't even connected yet.",
             lesson:"Vague on something already fragile = even more fragile."}
          ]
        },
        {

/* ============================================================
   ENGINE  (scenario-agnostic)
   ============================================================ */
const G = {
  scenario:null, statesById:{}, stateId:null,
  turns:0, saved:null, history:[], mode:"team",
  comicSpent:false, order:{}, revealHTML:"", revealType:"placeholder",
  showTestFlag:false, animate:false, ended:false

/* ---------- choice normalization ----------
   New model: scope('broad'|'focused') · style('specified'|'vague') ·
   asksFor(text) · outcome('advance'|'setback'|'discipline').
   Falls back to the legacy `type` so un-ported scenarios still work. */
function normChoice(c){
  const t=c.type;
  const scope = c.scope || (t==='greedy'?'broad':'focused');
  const style = c.style || (t==='vague'?'vague':'specified');
  let outcome = c.outcome;
  if(!outcome) outcome = (t==='small')?'advance':(t==='discipline'?'discipline':'setback');
  if(outcome==='repair') outcome='setback';
  return {scope,style,outcome};
}
/* neutral SCOPE tag — never signals good/bad (broad is best early, worst late) */
function scopeMeta(c){
  const n=normChoice(c);
  return n.scope==='broad'
    ? {cls:'broad',   icon:'layers', label:'Broad'}
    : {cls:'focused', icon:'step',   label:'Focused'};
}
/* factual "asks for" line — conveys specificity as a fact, not a verdict */
function asksLine(c){
  if(c.asksFor) return c.asksFor;
  const n=normChoice(c);
  if(n.style==='vague') return 'Asks for: a general change, no details';
  return n.scope==='broad' ? 'Asks for: several things at once' : 'Asks for: one thing, clearly defined';
}
/* shuffle the card order once per state-entry so position is never a tell */
function displayOrder(st){
  if(!G.order[st.id]){
    const idx = st.choices.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
    G.order[st.id]=idx;
  }
  return G.order[st.id];
}

/* ---------- START GAME ---------- */
function startGame(scenarioId, mode){
  const scen = CONFIG.scenarios.find(s=>s.id===scenarioId) || CONFIG.scenarios[0];
  G.scenario = scen;
  G.statesById = {};
  scen.states.forEach(st=>G.statesById[st.id]=st);
  G.stateId = scen.startStateId;
  G.turns = CONFIG.meta.turns;
  G.saved = null;
  G.history = [];
  G.comicSpent = false;
  G.order = {};
  G.mode = mode || "team";
  G.ended = false;
  G.showTestFlag = false;
  G.revealType = "placeholder";
  G.revealHTML = CONFIG.ui.revealPlaceholder;
  G.animate = false;
  document.body.classList.toggle('board', G.mode==='board');
  renderGame();
}

function curState(){return G.statesById[G.stateId];}

/* ---------- record a turn in history (for the map) ---------- */
function record(kind, label, cost, from, to){
  // kind: 'advance' | 'setback' | 'discipline'
  G.history.push({kind, label, cost, from, to});
}

/* ---------- apply a scripted prompt choice ---------- */
function pickChoice(idx){
  if(G.ended) return;
  const st = curState();
  const ch = st.choices[idx];
  if(!ch) return;
  const cost = ch.cost==null?1:ch.cost;
  const outcome = normChoice(ch).outcome;

  // comic beat fires exactly once; later hits use revealPlain if provided
  let revealHTML = ch.reveal;
  if(ch.comicBeat){
    if(G.comicSpent && ch.revealPlain) revealHTML = ch.revealPlain;
    G.comicSpent = true;
  }
  const lessonHTML = ch.lesson;

  const fromP = st.progress||0;
  const target = G.statesById[ch.to];
  const toP = target ? (target.progress||0) : fromP;

  G.turns -= cost;
  record(outcome, ch.label, cost, fromP, toP);
  G.stateId = ch.to;
  G.showTestFlag = false;
  G.revealType = outcome;
  G.revealHTML = revealHTML + (lessonHTML?`<span class="lesson">${esc(lessonHTML)}</span>`:'');
  G.animate = true;

  checkEndOrRender();
}

/* ---------- discipline moves (engine-level) ---------- */
function doSave(){
  if(G.ended) return;
  const st = curState();
  G.saved = { id:G.stateId, name:st.name, progress:st.progress||0 };
  G.turns -= CONFIG.meta.disciplineCost;
  const p=st.progress||0;
  record('discipline', CONFIG.ui.save+' — '+st.name, CONFIG.meta.disciplineCost, p, p);
  G.revealType='discipline';
  G.revealHTML = CONFIG.ui.saveDone;
  G.showTestFlag=false; G.animate=false;
  checkEndOrRender();
}
function doTest(){
  if(G.ended) return;
  const st = curState();
  G.turns -= CONFIG.meta.disciplineCost;
  const p=st.progress||0;
  record('discipline', CONFIG.ui.test+' — '+st.name, CONFIG.meta.disciplineCost, p, p);
  G.revealType='discipline';
  G.revealHTML = st.testReveal || CONFIG.ui.testGenericFine;
  // reveal hidden breakage visually if the state hides some
  G.showTestFlag = (st.looksFine===false);
  G.animate=false;
  checkEndOrRender();
}
function doRestore(){
  if(G.ended) return;
  if(!G.saved){
    // costs nothing — just informs
    G.revealType='discipline';
    G.revealHTML = CONFIG.ui.restoreNone;
    renderGame();
    return;
  }
  G.turns -= CONFIG.meta.disciplineCost;
  const fromP=curState().progress||0;
  record('discipline', CONFIG.ui.restore+' — '+G.saved.name, CONFIG.meta.disciplineCost, fromP, G.saved.progress||0);
  G.stateId = G.saved.id;
  G.revealType='discipline';
  G.revealHTML = CONFIG.ui.restoreDone;
  G.showTestFlag=false; G.animate=true;
  checkEndOrRender();
}

/* ---------- end detection ---------- */
function checkEndOrRender(){
  const st = curState();
  if(st.goal || G.stateId===G.scenario.goalStateId){
    G.ended=true; renderEnd(true); return;
  }
  if(G.turns<=0){
    G.ended=true; renderEnd(false); return;
  }
  renderGame();
}

          <div class="step ${h.kind}">
            <span class="n">${i+1}</span>
            <div><div class="st">${esc(h.label)}</div><div class="sc">${kindLabel(h.kind)} · ${h.cost} ${esc(ui.costTurn)}<span class="delta">${ds}</span></div></div>
          </div>`;}).join('') || '<div class="psub">No turns were taken.</div>'}
      </div>
      <div class="map-legend">
        <span><i class="g"></i>Progress</span><span><i class="r"></i>Repair / waste</span><span><i class="b"></i>Discipline (save/test/restore)</span>
      </div>
      <div class="tally">
        <div class="t g"><div class="num">${adv}</div><div class="lb">${esc(ui.advances)}</div></div>
        <div class="t r"><div class="num">${rep}</div><div class="lb">${esc(ui.repairs)}</div></div>
        <div class="t b"><div class="num">${dis}</div><div class="lb">${esc(ui.discipline)}</div></div>
        <div class="t"><div class="num">${used}</div><div class="lb">${esc(ui.turnsUsed)}</div></div>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="panel">
      <h3>${ic('flag')} ${esc(ui.progTitle)}</h3>
      <div class="progbar"><i style="width:${progress}%"></i></div>
      <div class="prog-lbl"><span>${esc(scen.appName)}</span><span>${progress}% — ${esc(curState().name)}</span></div>
    </div>

    <!-- PAYOFF -->
    <div class="panel payoff">
      <h3>${ic('rocket')} ${esc(ui.payoffTitle)}</h3>
      <div class="rtxt" style="font-size:15.5px;line-height:1.6">${esc(ui.payoff)}</div>
    </div>

    <!-- DEBRIEF -->
    <div class="panel">
      <h3>${ic('users')} ${esc(ui.debriefTitle)}</h3>
      <ul class="debrief-list">
        ${ui.debrief.map(q=>`<li><span class="qm">?</span><span>${esc(q)}</span></li>`).join('')}
      </ul>
    </div>

    <!-- HANDOFF -->
    <div class="panel handoff">
      <h3 style="justify-content:center">${ic('arrow')} ${esc(ui.handoffTitle)}</h3>
      <div>${esc(ui.handoff)}</div>
    </div>

    <div class="end-actions">
      <button class="btn-primary green" id="replayBtn">${ic('undo')} ${esc(ui.replay)}</button>
      <button class="ghost-btn" id="menuBtn" style="padding:14px 22px;font-size:15px">${ic('layers')} ${esc(ui.newGame)}</button>
    </div>
    <div class="foot">${esc(CONFIG.meta.title)}</div>
  </div>`;

  document.getElementById('replayBtn').onclick=()=>startGame(G.scenario.id, G.mode);
  document.getElementById('menuBtn').onclick=renderStart;
}
function kindLabel(k){return k==='advance'?'Progress':k==='setback'?'Setback / repair':'Discipline';}

/* ---------- boot ---------- */
renderStart();
</script>
</body>
</html>
