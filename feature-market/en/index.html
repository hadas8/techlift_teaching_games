<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature Market</title>
<style>
  :root{
    --bg-board:#141233;
    --bg-board2:#1f1b4d;
    --panel-board:#221d55;
    --panel-board-2:#2a2470;
    --line-board:#3b3480;
    --bg-wallet:#f6f5fb;
    --panel-wallet:#ffffff;
    --line-wallet:#e2dff2;
    --ink:#f3f1ff;
    --ink-dim:#b8b3e0;
    --ink-dark:#211c47;
    --ink-dark-dim:#635d94;
    --accent:#8f7bff;
    --accent-2:#c6ff5e;
    --spend:#ff6b5b;
    --save:#4fd6a8;
    --gold:#ffd166;
    --danger:#ff4d6d;
    --radius:16px;
    --radius-sm:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Rubik","Arial Hebrew","Arial",sans-serif;
    background:var(--bg-wallet);
    color:var(--ink-dark);
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;}
  .icon svg{width:1.4em;height:1.4em;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .icon{display:inline-flex;align-items:center;justify-content:center;}

  /* ---------- MENU ---------- */
  .menu-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%, #2a2470, #141233 70%);color:var(--ink);padding:32px 16px;}
  .menu-card{max-width:720px;text-align:center;}
  .menu-card h1{font-size:2.6em;margin:0 0 6px;}
  .menu-card .sub{color:var(--ink-dim);font-size:1.15em;margin-bottom:36px;}
  .menu-choices{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
  .menu-btn{position:relative;flex:1;min-width:240px;background:var(--panel-board);border:1px solid var(--line-board);border-radius:var(--radius);padding:26px 20px;color:var(--ink);text-align:left;transition:transform .15s, background .15s;}
  .menu-btn:hover{transform:translateY(-3px);background:var(--panel-board-2);}
  .menu-btn.recommended{border:2px solid var(--accent-2);background:var(--panel-board-2);box-shadow:0 0 0 4px rgba(198,255,94,.12);}
  .menu-flag{position:absolute;top:-12px;inset-inline-start:20px;background:var(--accent-2);color:#141233;font-size:.75em;font-weight:800;padding:3px 12px;border-radius:20px;}
  .menu-btn .icon{color:var(--accent-2);margin-bottom:10px;}
  .menu-btn h3{margin:6px 0 6px;font-size:1.3em;}
  .menu-btn p{margin:0;color:var(--ink-dim);font-size:.95em;line-height:1.5;}
  .menu-note{margin-top:30px;font-size:.85em;color:var(--ink-dim);line-height:1.6;}

  /* ---------- BOARD ---------- */
  .board{min-height:100vh;background:linear-gradient(160deg,var(--bg-board),var(--bg-board2));color:var(--ink);display:flex;flex-direction:column;}
  .board-top{display:flex;justify-content:space-between;align-items:center;padding:18px 34px;}
  .board-title{font-size:1.3em;font-weight:700;display:flex;align-items:center;gap:10px;}
  .board-title .icon{color:var(--accent-2);}
  .board-progress{font-size:1.05em;color:var(--ink-dim);}
  .board-dots{display:flex;gap:6px;padding:0 34px 10px;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line-board);}
  .dot.done{background:var(--accent-2);}
  .dot.current{background:var(--gold);box-shadow:0 0 0 4px rgba(255,209,102,.25);}
  .board-main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 34px 40px;}
  .board-card{width:100%;max-width:900px;background:var(--panel-board);border:1px solid var(--line-board);border-radius:24px;padding:40px 44px;position:relative;overflow:hidden;}
  .board-card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg, rgba(143,123,255,.12), transparent 60%);}
  .board-card-head{display:flex;align-items:center;gap:22px;position:relative;}
  .board-card-head .icon{width:64px;height:64px;background:var(--panel-board-2);border-radius:18px;color:var(--accent-2);flex-shrink:0;}
  .board-card-head .icon svg{width:34px;height:34px;}
  .board-feature-name{font-size:2em;font-weight:700;margin:0;}
  .board-badge{display:inline-block;font-size:.72em;padding:3px 10px;border-radius:20px;background:var(--accent);color:#141233;font-weight:700;margin-inline-start:10px;vertical-align:middle;}
  .board-badge.wildcard{background:var(--gold);}
  .board-sticker{position:relative;margin-top:26px;display:flex;align-items:baseline;gap:10px;}
  .board-sticker .num{font-size:3.6em;font-weight:800;color:var(--accent-2);line-height:1;}
  .board-sticker .lbl{color:var(--ink-dim);font-size:1.1em;}
  .board-note{position:relative;margin-top:14px;color:var(--ink-dim);font-size:1.05em;line-height:1.6;}
  .reveal-btn{position:relative;margin-top:28px;background:var(--gold);color:#3a2a00;border:none;border-radius:var(--radius-sm);padding:14px 26px;font-size:1.1em;font-weight:700;}
  .board-round-prompt{position:relative;margin-top:24px;font-size:1.25em;font-weight:700;color:var(--accent-2);}
  .board-rules{position:relative;margin:22px 0 0;padding-inline-start:22px;line-height:1.9;font-size:1.12em;color:var(--ink);}
  .board-rules li{margin-bottom:8px;}
  .reveal-btn:hover{filter:brightness(1.06);}
  .reveal-panel{position:relative;margin-top:24px;background:rgba(0,0,0,.22);border:1px dashed var(--line-board);border-radius:var(--radius-sm);padding:22px 24px;animation:pop .35s ease;}
  .reveal-panel.lesson-panel{background:rgba(255,209,102,.1);border-color:var(--gold);}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .reveal-truth{font-size:1.15em;color:var(--gold);font-weight:600;margin:0 0 12px;line-height:1.6;}
  .branch-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel-board-2);border-radius:10px;margin-bottom:8px;}
  .branch-row.disabled{opacity:.55;}
  .branch-row .price{font-weight:800;font-size:1.15em;color:var(--accent-2);}
  .branch-row .price.blocked{color:var(--danger);font-size:.95em;}
  .lesson-line{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-board);color:var(--ink);font-size:1.02em;line-height:1.6;}
  .lesson-line b{color:var(--accent-2);}
  .trap-stamp{display:inline-block;transform:rotate(-4deg);border:3px solid var(--danger);color:var(--danger);font-weight:800;padding:6px 16px;border-radius:10px;font-size:1.1em;margin-bottom:12px;}
  .board-caution{position:relative;margin-top:10px;color:var(--gold);font-size:.9em;}
  .board-nav{display:flex;justify-content:center;gap:14px;padding:0 34px 30px;}
  .nav-btn{background:var(--panel-board-2);border:1px solid var(--line-board);color:var(--ink);border-radius:var(--radius-sm);padding:12px 22px;font-size:1em;}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .nav-btn.primary{background:var(--accent-2);color:#141233;font-weight:700;border:none;}
  .board-reset{position:fixed;bottom:14px;inset-inline-end:14px;font-size:.8em;color:var(--ink-dim);background:none;border:1px solid var(--line-board);border-radius:8px;padding:6px 10px;}
  .board-framing{text-align:center;color:var(--ink-dim);padding:0 34px 6px;font-size:1.05em;}
  .board-end{max-width:820px;margin:0 auto;text-align:center;}
  .board-end h2{font-size:1.8em;}
  .takeaway{font-size:1.5em;font-weight:700;color:var(--accent-2);margin:26px 0;line-height:1.5;}
  .bridge{background:var(--panel-board-2);border-radius:var(--radius-sm);padding:20px;margin-top:22px;line-height:1.7;font-size:1.05em;}
  .reflect-box{background:var(--panel-board);border:1px solid var(--line-board);border-radius:var(--radius-sm);padding:16px 20px;margin-top:14px;text-align:left;}

  /* ---------- WALLET ---------- */
  .wallet{min-height:100vh;background:var(--bg-wallet);padding-bottom:60px;}
  .wallet-header{position:sticky;top:0;z-index:10;background:var(--panel-wallet);border-bottom:1px solid var(--line-wallet);padding:14px 18px;box-shadow:0 2px 10px rgba(30,20,80,.05);}
  .wallet-header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .wallet-team{font-weight:700;font-size:1.1em;}
  .wallet-idea{font-size:.85em;color:var(--ink-dark-dim);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .meter-wrap{margin-top:10px;}
  .meter-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .meter-num{font-size:1.6em;font-weight:800;transition:color .3s;}
  .meter-num.pulse{animation:flash .7s ease;}
  @keyframes flash{0%{transform:scale(1.18);}100%{transform:scale(1);}}
  .meter-bar-bg{height:14px;border-radius:8px;background:#eceafb;overflow:hidden;}
  .meter-bar{height:100%;border-radius:8px;background:var(--accent);transition:width .5s cubic-bezier(.2,.9,.3,1), background .3s;}
  .wallet-actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:.85em;text-decoration:underline;padding:2px;}
  .small-btn{background:var(--ink-dark);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.85em;}

  .wallet-main{max-width:760px;margin:0 auto;padding:18px 14px;}
  .framing-line{background:#efe9ff;color:#4c3ea8;border-radius:var(--radius-sm);padding:12px 16px;font-size:.95em;text-align:center;margin-bottom:16px;line-height:1.6;}
  .next-feature-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px;font-size:1.05em;font-weight:700;margin:4px 0 14px;}
  .next-feature-btn:hover{filter:brightness(1.05);}
  .wallet-done{display:flex;align-items:center;gap:10px;justify-content:center;background:#f0f8f4;color:#1d6b4d;border-radius:var(--radius);padding:18px;font-weight:700;margin-bottom:14px;}
  .wallet-eliminated{display:flex;align-items:flex-start;gap:12px;background:#fff1f2;color:#a5233f;border:1px solid #ff9fb0;border-radius:var(--radius);padding:18px;margin-bottom:14px;line-height:1.6;}
  .wallet-eliminated .icon{flex-shrink:0;color:var(--danger);}
  .lost-feature{display:inline-block;margin-top:6px;font-weight:700;}
  .leftover-panel{background:#fffaf0;border:1px solid #ffe0a3;border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;}
  .leftover-panel h3{margin:0 0 6px;font-size:1.05em;color:#8a6300;}
  .leftover-intro{margin:0 0 12px;font-size:.88em;color:var(--ink-dark-dim);line-height:1.6;}
  .leftover-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffe9c2;}
  .leftover-item:last-child{border-bottom:none;}
  .leftover-item button{background:var(--gold);color:#3a2a00;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:.85em;white-space:nowrap;}
  .leftover-item button:hover{filter:brightness(1.05);}
  .card{background:var(--panel-wallet);border:1px solid var(--line-wallet);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;transition:box-shadow .2s;}
  .card.locked{background:#fbfaff;}
  .card.just-changed{box-shadow:0 0 0 3px var(--accent-2);}
  .card-head{display:flex;align-items:center;gap:14px;}
  .card-head .icon{width:42px;height:42px;background:#f0edff;color:var(--accent);border-radius:12px;flex-shrink:0;}
  .card-head .icon svg{width:22px;height:22px;}
  .card-title{font-weight:700;font-size:1.08em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-sub{font-size:.82em;color:var(--ink-dark-dim);margin-top:2px;}
  .badge{font-size:.68em;padding:2px 9px;border-radius:14px;font-weight:700;}
  .badge.wildcard{background:var(--gold);color:#3a2a00;}
  .badge.trap{background:#ffe1e6;color:#a5233f;}
  .badge.blind{background:#e4e1ff;color:#4c3ea8;}
  .card-body{margin-top:12px;}
  .price-tag{font-size:1.4em;font-weight:800;color:var(--ink-dark);}
  .row-buttons{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:.95em;font-weight:700;}
  .btn-buy{background:var(--accent);color:#fff;}
  .btn-skip{background:#eeecf7;color:var(--ink-dark);}
  .btn-branch{background:#f0edff;color:var(--ink-dark);border:1px solid #ddd6ff;text-align:left;padding:12px 16px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;}
  .btn-branch:hover{background:#e4ddff;}
  .btn-branch:disabled{opacity:.5;cursor:not-allowed;}
  .btn-branch .p{font-weight:800;color:var(--spend);}
  .btn-branch .p.blocked{color:var(--danger);font-size:.82em;font-weight:600;}
  .reveal-inline{margin-top:12px;background:#fff8e6;border:1px dashed #ffd166;border-radius:10px;padding:14px 16px;}
  .reveal-inline .truth{color:#8a6300;font-weight:600;margin:0 0 10px;line-height:1.6;}
  .lesson-mini{margin-top:10px;font-size:.88em;color:var(--ink-dark-dim);line-height:1.6;border-top:1px dashed #e2dff2;padding-top:10px;}
  .lesson-mini b{color:var(--accent);}
  .locked-line{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .locked-line .lab{color:var(--ink-dark-dim);font-size:.95em;}
  .locked-line .amt{font-weight:800;}
  .amt.spend{color:var(--spend);}
  .amt.save{color:var(--save);}
  .lock-icon{color:#b6b0e0;width:18px;height:18px;}
  .ladder-tier{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f7f5ff;border-radius:10px;margin-bottom:8px;border:1px solid #ece8ff;}
  .ladder-tier .p{font-weight:800;color:var(--ink-dark);}
  .ladder-tier .p.free{color:var(--save);}
  .tier-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.85em;font-weight:700;}
  .trap-warn{background:#fff1f2;border:1px dashed #ff9fb0;border-radius:10px;padding:14px 16px;margin-top:10px;}
  .trap-warn p{margin:0;color:#a5233f;line-height:1.6;}
  .blind-opt{display:flex;justify-content:space-between;align-items:center;background:#f7f5ff;border:1px solid #ece8ff;border-radius:10px;padding:14px 16px;margin-bottom:8px;}
  .blind-opt button{background:var(--ink-dark);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:700;}
  .praise{color:var(--save);font-size:.88em;margin-top:8px;}
  .offer-note{color:var(--ink-dark-dim);font-size:.9em;margin:0 0 10px;line-height:1.6;}
  .branch-strike{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#f6f4fb;border-radius:8px;margin-bottom:8px;color:var(--ink-dark-dim);font-size:.9em;}
  .branch-strike .p.blocked{color:var(--danger);font-weight:700;}
  .btn-branch:disabled{opacity:.5;cursor:not-allowed;}
  .elim-reveal{display:inline-block;margin-top:8px;line-height:1.6;}
  .elim-lesson{display:inline-block;margin-top:8px;line-height:1.6;}

  .basket-panel{background:var(--panel-wallet);border:1px solid var(--line-wallet);border-radius:var(--radius);padding:16px 20px;margin-top:6px;}
  .basket-panel h3{margin:0 0 10px;font-size:1.05em;}
  .basket-item{display:flex;justify-content:space-between;font-size:.9em;padding:6px 0;border-bottom:1px solid #f1efff;}
  .basket-empty{color:var(--ink-dark-dim);font-size:.9em;}
  .basket-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:2px solid var(--line-wallet);font-weight:800;}
  .negative-warn{background:#fff1f2;color:#a5233f;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:.9em;}

  .end-panel{background:var(--panel-wallet);border:1px solid var(--line-wallet);border-radius:var(--radius);padding:20px;margin-top:16px;}
  .end-panel h3{margin-top:0;}
  .reflect-q{margin-top:16px;}
  .reflect-q label{display:block;font-weight:700;margin-bottom:6px;font-size:.92em;}
  .reflect-q textarea{width:100%;border:1px solid var(--line-wallet);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:.92em;resize:vertical;min-height:56px;}
  .takeaway-wallet{background:#efe9ff;color:#4c3ea8;border-radius:10px;padding:14px 16px;margin-top:16px;font-weight:700;text-align:center;line-height:1.6;}
  .bridge-wallet{background:#f0f8f4;color:#1d6b4d;border-radius:10px;padding:14px 16px;margin-top:12px;line-height:1.6;font-size:.92em;}

  .setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .setup-card{max-width:480px;width:100%;background:var(--panel-wallet);border:1px solid var(--line-wallet);border-radius:var(--radius);padding:30px 26px;}
  .setup-card h2{margin-top:0;}
  .setup-card label{display:block;font-weight:700;margin:16px 0 6px;font-size:.92em;}
  .setup-card input, .setup-card textarea{width:100%;border:1px solid var(--line-wallet);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:1em;}
  .setup-card textarea{min-height:70px;resize:vertical;}
  .setup-card button{margin-top:20px;width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:1.05em;font-weight:700;}
  .back-link{display:inline-block;margin-bottom:14px;color:var(--ink-dark-dim);font-size:.85em;}

  @media (max-width:640px){
    .board-card{padding:26px 22px;}
    .board-feature-name{font-size:1.5em;}
    .board-sticker .num{font-size:2.6em;}
    .board-top,.board-main,.board-nav,.board-dots{padding-inline:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   CONFIG — everything about the game content lives here.
   Change prices, text, forks or add features without touching
   any of the rendering code below.
   ========================================================= */
const CONFIG = {
  meta: {
    title: "Feature Market",
    subtitle: "Same store, same prices, a private wallet for every team",
    budget: 100
  },
  // Fixed play order (by feature id). Change this to reorder the game;
  // both the board and the wallet follow it. Interleaved on purpose —
  // not grouped by type, so the order isn't predictable.
  order: ["home","login","ui","content","mystery","core-action","push","storage","onboarding","ai-agent","social","payments"],
  texts: {
    boardFraming: "Each team buys from its own wallet, for its own app. Same price for everyone — no race to buy first.",
    walletFraming: "Only take what your app needs. Skipping is a legit move — that's money left in your pocket.",
    roundPrompt: "Every team decides now: buy or pass?",
    boardIntroTitle: "How to play",
    boardIntroRules: [
      "You start with a fixed budget of 100 build points.",
      "Keep track yourselves of how much money you have left and which features you bought.",
      "For each feature, choose: buy or don't buy.",
      "If you buy — watch out: there may be surprises and unexpected consequences.",
      "If you run out of money or go below zero — you can't buy anything else (not even free features), and you lose the last feature you bought.",
      "The game ends when every team is out of money, or when the features run out.",
      "The winner: the team with the best features for an MVP."
    ],
    boardIntroStart: "Let's start",
    leftoverTitle: "Got budget left?",
    leftoverIntro: "You can now add one or more of the features you skipped — at the final price, as long as you have enough.",
    leftoverNone: "There are no more features you can add with the budget you have left.",
    eliminatedTitle: "Out of budget",
    eliminatedText: "You went below zero — you're out of the market. You can't buy anything else, and you lost the last feature you bought.",
    boardEndTitle: "Getting ready to defend",
    boardEndIntro: "Before presenting, each team prepares two short answers:",
    reflectPrompts: [
      "What was the toughest fork, and why did you choose the way you did — based on your app?",
      "Which one feature did you turn down, and why?"
    ],
    takeaway: "The winning basket isn't the biggest or the most impressive — it's the one that reaches your app's goal for the lowest cost.",
    bridge: "The surprises you ran into today — a hidden server, a hidden database, hidden security — are exactly the same thing when you really build with AI: tokens. An ambitious feature doesn't just cost more money — it makes the AI build a whole infrastructure underneath it and burn through your budget. That's what we'll learn to watch out for in the next part."
  },
  features: [
    {
      id: "home",
      name: "Home screen with a clear message",
      icon: "home",
      sticker: 20,
      forkType: "none",
      revealText: "The price includes basic design — the AI tool builds the simple look for you for free; you didn't pay for it separately.",
      lesson: "Some of the basics are cheaper than you thought, because the AI does the groundwork."
    },
    {
      id: "core-action",
      name: "One core action",
      icon: "click",
      sticker: 15,
      forkType: "none",
      revealText: "This is the one thing the user actually does in the app. No price surprise here — but nothing to cut either: in most apps this is always in.",
      lesson: "Not every feature hides a cost — some really are as simple as they look."
    },
    {
      id: "login",
      name: "Login / profile",
      icon: "user",
      sticker: 30,
      forkType: "mandatory",
      revealText: "There's no 'login for 30' — real accounts need a server, storage and security.",

   Storage helpers — everything wrapped in try/catch since
   localStorage may be unavailable (e.g. sandboxed preview).
   ========================================================= */
const SK = "featureMarket_en_v1_";
function sGet(key){ try{ const v = localStorage.getItem(SK+key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function sSet(key, val){ try{ localStorage.setItem(SK+key, JSON.stringify(val)); }catch(e){} }
function sRemove(key){ try{ localStorage.removeItem(SK+key); }catch(e){} }

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* Ordered feature list — board and wallet both play in CONFIG.order.
   Falls back to declaration order if no order array is given. */
function orderedFeatures(){
  if(!Array.isArray(CONFIG.order)) return CONFIG.features.slice();
  const byId = {};
  CONFIG.features.forEach(f => byId[f.id] = f);
  return CONFIG.order.map(id => byId[id]).filter(Boolean);
}

function renderBoard(){
  const state = loadBoardState();

  if(!state.started){

    bindBoardEvents();

function boardStickerBlock(f){

/* Board reveal is a fixed 2-step flow for every feature:
   stage 0 → offer only, button "What's included in the price"
   stage 1 → what's included / the options, button "What's the lesson?"
   stage 2 → the consequence + lesson. */
function boardStages(f, stage){
  let html = "";
  if(stage === 0){
    html += `<div class="board-round-prompt">${esc(CONFIG.texts.roundPrompt)}</div>`;
    html += `<button class="reveal-btn" data-action="reveal1">What's included in the price</button>`;
    return html;
  }
  html += `<div class="reveal-panel">${boardIncludedPanel(f, stage)}</div>`;
  if(stage === 1){
    html += `<button class="reveal-btn" data-action="reveal2">What's the lesson?</button>`;
  } else {
    html += `<div class="reveal-panel lesson-panel">${boardLessonPanel(f)}<div class="lesson-line"><b>The lesson:</b> ${esc(f.lesson)}</div></div>`;
  }
  return html;
}

/* What's included / the options — no consequences yet.
   For the blind box, the price is a secret until "What's the lesson?" (stage 2). */
function boardIncludedPanel(f, stage){
  if(f.forkType === "none"){
    return `<p class="reveal-truth">${esc(f.revealText)}</p>`;
  }
  if(f.forkType === "mandatory"){
    return `<p class="board-note">The sticker price no longer applies — pick a version:</p>` +
      `<div class="branch-row disabled"><span>Original sticker</span><span class="price blocked"><s>${f.sticker}</s> not available</span></div>` +
      f.branches.map(b => `
        <div class="branch-row">
          <span>${esc(b.label)}</span>
          <span class="price">${b.price}</span>
        </div>`).join("");
  }
  if(f.forkType === "ladder"){
    return (f.note ? `<p class="reveal-truth">${esc(f.note)}</p>` : "") +
      f.tiers.map(t => `
        <div class="branch-row">
          <span>${esc(t.label)}</span>
          <span class="price">${t.free ? "Free" : t.price}</span>
        </div>`).join("");
  }
  if(f.forkType === "trap"){
    return `<div class="branch-row"><span>By the sticker, it looks like a regular feature</span><span class="price">${f.sticker}</span></div>`;
  }
  if(f.forkType === "blind"){
    const showPrice = stage >= 2;
    return `<p class="board-note">${showPrice ? "And here's what each option cost:" : "Once the teams have chosen — this is what they got. The price is revealed only at 'What's the lesson?'."}</p>` +
      f.options.map(o => `
        <div class="branch-row">
          <span>${esc(o.teaser)} &rarr; ${esc(o.revealLabel)}</span>
          <span class="price">${showPrice ? o.revealPrice : "???"}</span>
        </div>`).join("");
  }
  return "";
}

/* The consequence — shown only after "What's the lesson?". */
function boardLessonPanel(f){
  if(f.forkType === "mandatory"){
    return `<p class="reveal-truth">${esc(f.revealText)}</p>` +
      (f.judgment ? `<p class="board-note"><b>Judgment call:</b> ${esc(f.judgment)}</p>` : "");
  }
  if(f.forkType === "ladder"){
    const secret = f.tiers.find(t => t.secretNote);
    return secret ? `<p class="reveal-truth">${esc(secret.secretNote)}</p>` : "";
  }
  if(f.forkType === "trap"){
    return `<div class="trap-stamp">Out of bounds for an MVP</div><p class="reveal-truth">${esc(f.trapReveal)}</p>`;
  }
  return "";
}

function bindBoardEvents(){
  app.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", e=>{
      const action = el.getAttribute("data-action");
      const state = loadBoardState();
      const count = orderedFeatures().length;
      if(action === "start"){ state.started = true; state.index = 0; state.stage = 0; saveBoardState(state); renderBoard(); }
      else if(action === "reveal1"){ state.stage = 1; saveBoardState(state); renderBoard(); }
      else if(action === "reveal2"){ state.stage = 2; saveBoardState(state); renderBoard(); }
      else if(action === "next"){ e.preventDefault(); state.index = Math.min(state.index+1, count); state.stage = 0; saveBoardState(state); renderBoard(); }
      else if(action === "prev"){ e.preventDefault(); state.index = Math.max(state.index-1, 0); state.stage = 0; saveBoardState(state); renderBoard(); }
      else if(action === "finish"){ e.preventDefault(); state.index = count; state.stage = 0; saveBoardState(state); renderBoard(); }
      else if(action === "reset"){ if(confirm("Reset the board to the start of the game?")){ sRemove("board"); renderBoard(); } }
    });
  });
}

function spentFor(teamState){
  let spent = 0;
  Object.values(teamState.decisions).forEach(d=>{
    if(d && (d.status === "bought") && typeof d.price === "number") spent += d.price;
  });
  return spent;
}

/* The "sensible final price" of a feature for the leftover round —
   the version that makes sense in an MVP. Returns null for features
   that shouldn't be offered (traps, blind box, no reasonable price). */
function sensiblePrice(f){
  if(f.forkType === "none") return typeof f.sticker === "number" ? f.sticker : null;
  if(f.forkType === "mandatory"){
    const prices = f.branches.filter(b => typeof b.price === "number").map(b => b.price);
    return prices.length ? Math.min(...prices) : null; // the downgrade
  }
  if(f.forkType === "ladder"){
    const paid = f.tiers.filter(t => !t.free && typeof t.price === "number").map(t => t.price);
    return paid.length ? Math.min(...paid) : null; // cheapest real upgrade
  }
  return null; // trap / blind: not offered
}

/* Features the team hasn't bought yet, at their sensible price, that
   the team can still afford with `remaining`. */
function leftoverOffers(teamState, remaining){
  const offers = [];
  orderedFeatures().forEach(f => {
    const d = teamState.decisions[f.id];
    if(d && d.status === "bought") return; // already own it
    const price = sensiblePrice(f);
    if(price == null || price > remaining) return;
    let label = f.name;
    if(f.forkType === "mandatory"){
      const b = f.branches.find(x => x.price === price);
      if(b) label = f.name + ": " + b.label;
    } else if(f.forkType === "ladder"){
      const t = f.tiers.find(x => x.price === price);
      if(t) label = f.name + ": " + t.label;
    }
    offers.push({ id: f.id, price, label });
  });
  return offers;
}

/* Enforce the budget rule: if a team drops below zero, it's out of the
   market — it loses the most recently acquired feature and can't buy
   anymore. Removing that purchase restores the budget to its pre-buy
   level; the penalty is the lost feature plus the lock-out. */
function enforceBudget(teamState){
  const remaining = CONFIG.meta.budget - spentFor(teamState);
  if(remaining >= 0 || teamState.eliminated) return;
  let lastId = null, lastSeq = -1;
  Object.entries(teamState.decisions).forEach(([id, d]) => {
    if(d && d.status === "bought" && (d.seq || 0) > lastSeq){ lastSeq = d.seq || 0; lastId = id; }
  });
  teamState.eliminated = true;
  if(lastId){
    const lost = teamState.decisions[lastId];
    teamState.lostFeatureLabel = lost.label;
    teamState.eliminationReveal = lost.reveal || "";
    teamState.eliminationLesson = lost.lesson || "";
    delete teamState.decisions[lastId];
  }
}

          <div class="wallet-actions">
            <button class="link-btn" data-action="switch-team">Switch team</button>
          </div>
        </div>
        <div class="meter-wrap">
          <div class="meter-row">
            <span>Budget left</span>
            <span class="meter-num" id="meter-num"></span>
          </div>
          <div class="meter-bar-bg"><div class="meter-bar" id="meter-bar"></div></div>
        </div>
      </div>
      <div class="wallet-main">
        <div class="framing-line">${esc(CONFIG.texts.walletFraming)}</div>
        <div id="cardsList"></div>
        <div id="basketSummary"></div>
        <div id="endScreen"></div>
      </div>
    </div>`;

  app.querySelector('[data-action="switch-team"]').addEventListener("click", ()=>{
    if(confirm("Switch team? The current team's data will stay saved, but you can only get back to it if you remember its starting details.")){
      sRemove("activeTeam");
      renderWallet();
    }
  });

  if(!walletClickBound){ app.addEventListener("click", walletDelegatedClick); walletClickBound = true; }

  updateMeter(teamId);
  renderCards(teamId);
  renderBasket(teamId);
}

function updateMeter(teamId){
  const teamState = loadTeam(teamId);
  const remaining = CONFIG.meta.budget - spentFor(teamState);
  const pct = Math.max(0, Math.min(100, (remaining / CONFIG.meta.budget) * 100));
  const numEl = document.getElementById("meter-num");
  const barEl = document.getElementById("meter-bar");
  if(!numEl || !barEl) return;
  numEl.textContent = remaining + " / " + CONFIG.meta.budget;
  numEl.classList.remove("pulse");
  requestAnimationFrame(()=> numEl.classList.add("pulse"));
  barEl.style.width = pct + "%";
  barEl.style.background = remaining < 0 ? "var(--danger)" : (pct < 20 ? "var(--spend)" : (pct < 50 ? "var(--gold)" : "var(--save)"));
  numEl.style.color = remaining < 0 ? "var(--danger)" : "var(--ink-dark)";
}

function renderCards(teamId){
  const teamState = loadTeam(teamId);
  const remaining = CONFIG.meta.budget - spentFor(teamState);
  const list = document.getElementById("cardsList");
  if(!list) return;
  const features = orderedFeatures();
  const idx = Math.min(teamState.walletIndex || 0, features.length);
  if(teamState.eliminated){
    list.innerHTML = `<div class="wallet-eliminated">${icon("warn")} <div>
      <b>${esc(CONFIG.texts.eliminatedTitle)}</b><br>${esc(CONFIG.texts.eliminatedText)}
      ${teamState.lostFeatureLabel ? `<br><span class="lost-feature">Feature you lost: ${esc(teamState.lostFeatureLabel)}</span>` : ""}
      ${teamState.eliminationReveal ? `<br><span class="elim-reveal">${esc(teamState.eliminationReveal)}</span>` : ""}
      ${teamState.eliminationLesson ? `<br><span class="elim-lesson"><b>The lesson:</b> ${esc(teamState.eliminationLesson)}</span>` : ""}
    </div></div>`;
    return;
  }
  if(idx >= features.length){
    list.innerHTML = `<div class="wallet-done">${icon("check")} You've gone through all the features. Scroll down for the summary and to get ready to defend.</div>`;
    return;
  }
  const f = features[idx];
  const decision = teamState.decisions[f.id] || null;
  const done = decision && (decision.status === "bought" || decision.status === "skipped");
  list.innerHTML = cardTemplate(f, teamState, remaining) +
    (done ? `<button class="next-feature-btn" data-action="next-feature">Next feature &rarr;</button>` : "");
}

/* Wallet card is a staged flow, identical shape for every feature:
   (no decision) → offer         : Buy / Skip  (or option buttons for ladder/blind)
   stage "options"               : pick a version (mandatory only)
   stage "lesson"                : "You chose: …" + button What's the lesson?
   status bought/skipped         : locked. Budget only moves at the lesson step. */
function cardTemplate(f, teamState, remaining){
  const decision = teamState.decisions[f.id] || null;
  const done = decision && (decision.status === "bought" || decision.status === "skipped");
  let badge = "";
  if(f.forkType === "blind") badge = '<span class="badge blind">Blind pick</span>';

  let head = `
    <div class="card-head">
      ${icon(f.icon)}
      <div>
        <div class="card-title">${esc(f.name)} ${badge}</div>
        ${f.note ? `<div class="card-sub">${esc(f.note)}</div>` : ""}
      </div>
    </div>`;

  let body;
  if(done) body = lockedCardBody(decision);
  else if(!decision) body = offerBody(f, remaining);
  else if(decision.stage === "options") body = optionsBody(f, decision, remaining);
  else if(decision.stage === "lesson") body = lessonBody(f, decision);
  else body = offerBody(f, remaining);

  return `<div class="card ${done?'locked':''}" data-feature="${f.id}">${head}<div class="card-body">${body}</div></div>`;
}

function offerBody(f, remaining){
  if(f.forkType === "blind"){
    return `<p class="offer-note">You choose without knowing what's inside and without knowing the price. Only after choosing will you see what you got and how much you paid.</p>` +
      f.options.map((o,i)=>`
        <div class="blind-opt">
          <span>${esc(o.teaser)}</span>
          <button data-action="pick-blind" data-feature="${f.id}" data-opt="${i}">Pick blindfolded</button>
        </div>`).join("") +
      `<div class="row-buttons"><button class="btn btn-skip" data-action="skip" data-feature="${f.id}">Skip</button></div>`;
  }
  if(f.forkType === "ladder"){
    return `<p class="offer-note">${f.note ? esc(f.note) : "The basic version is already included for free. You can choose an upgrade."}</p>` +
      f.tiers.map((t,i)=>`
        <div class="ladder-tier">
          <span>${esc(t.label)}</span>
          <span style="display:flex; align-items:center; gap:10px;">
            <span class="p ${t.free?'free':''}">${t.free ? "Free" : t.price + " pts"}</span>
            <button class="tier-btn" data-action="pick-tier" data-feature="${f.id}" data-tier="${i}" ${(!t.free && t.price>remaining)?"disabled":""}>Choose</button>
          </span>
        </div>`).join("");
  }
  const sub = f.forkType === "mandatory" ? "(sticker — may not be the final price)" : (f.forkType === "trap" ? "(sticker)" : "");
  return `
    <div class="price-tag">${f.sticker} pts ${sub ? `<span style="font-size:.6em; color:var(--ink-dark-dim); font-weight:400;">${sub}</span>` : ""}</div>
    <div class="row-buttons">
      <button class="btn btn-buy" data-action="buy" data-feature="${f.id}">Buy</button>
      <button class="btn btn-skip" data-action="skip" data-feature="${f.id}">Skip</button>
    </div>`;
}

function optionsBody(f, decision, remaining){
  return `
    <div class="reveal-inline">
      <p class="truth">The sticker no longer applies — you need to pick a version:</p>
      <div class="branch-strike"><span>Original sticker</span><span class="p blocked"><s>${f.sticker}</s> not available</span></div>
      ${f.branches.map((b,i) => `
        <button class="btn-branch" data-action="pick-branch" data-feature="${f.id}" data-branch="${i}" ${(typeof b.price==="number" && b.price>remaining) ? "disabled":""}>
          <span>${esc(b.label)}</span>
          <span class="p">${b.price} pts${b.price>remaining?' (not enough budget)':''}</span>
        </button>`).join("")}
      <div class="row-buttons"><button class="btn btn-skip" data-action="skip" data-feature="${f.id}">Cancel — skip</button></div>
    </div>`;
}

function lessonBody(f, decision){
  const showPrice = f.forkType !== "blind";
  return `
    <div class="reveal-inline">
      <div class="locked-line">
        <span class="lab">You chose: ${esc(decision.pendingLabel)}</span>
        ${showPrice ? `<span class="amt spend">${decision.pendingPrice} pts</span>` : `<span class="amt" style="color:var(--ink-dark-dim);">Price in a moment…</span>`}
      </div>
      <div class="row-buttons"><button class="btn btn-buy" data-action="lesson" data-feature="${f.id}">What's the lesson?</button></div>
    </div>`;
}

function lockedCardBody(decision){
  const isSpend = decision.status === "bought" && decision.price > 0;
  const amt = decision.status === "bought" ? decision.price : (decision.saved || 0);
  let amtText;
  if(decision.displayAmt) amtText = decision.displayAmt;
  else if(isSpend) amtText = "-" + amt;
  else if(decision.status === "bought" && decision.price === 0) amtText = "Free";
  else amtText = "Saved " + amt;
  return `
    <div class="locked-line">
      <span class="lab">${esc(decision.label || (decision.status==="skipped" ? "You skipped" : ""))}</span>
      <span class="amt ${isSpend?'spend':'save'}">${amtText}</span>
    </div>
    ${decision.reveal ? `<div class="lesson-mini">${esc(decision.reveal)}</div>` : ""}
    ${decision.lesson ? `<div class="lesson-mini"><b>The lesson:</b> ${esc(decision.lesson)}</div>` : ""}
    ${decision.praise ? `<div class="praise">${esc(decision.praise)}</div>` : ""}
    <div style="margin-top:8px; display:flex; align-items:center; gap:6px; color:#b6b0e0; font-size:.8em;">${icon("lock")} Locked</div>
  `;
}

function renderBasket(teamId){
  const teamState = loadTeam(teamId);
  const spent = spentFor(teamState);
  const remaining = CONFIG.meta.budget - spent;
  const bought = Object.values(teamState.decisions).filter(d => d && d.status === "bought");
  const basketEl = document.getElementById("basketSummary");
  const endEl = document.getElementById("endScreen");
  if(basketEl){
    basketEl.innerHTML = `
      <div class="basket-panel">
        <h3>Your basket</h3>
        ${bought.length ? bought.map(b=>`<div class="basket-item"><span>${esc(b.label)}</span><span>${b.price} pts</span></div>`).join("") : `<div class="basket-empty">You haven't bought anything yet.</div>`}
        <div class="basket-total"><span>Total spent</span><span>${spent} pts</span></div>
        <div class="basket-total" style="border-top:none;padding-top:0;"><span>Left in budget</span><span>${remaining} pts</span></div>
      </div>`;
  }
  if(endEl){
    const features = orderedFeatures();
    const finished = (teamState.walletIndex || 0) >= features.length;
    if(!finished && !teamState.eliminated){ endEl.innerHTML = ""; return; }

    // Optional leftover round: spend remaining budget on sensible features
    // the team skipped. Only for teams that finished with money left.
    let leftoverHtml = "";
    if(finished && !teamState.eliminated && remaining > 0){
      const offers = leftoverOffers(teamState, remaining);
      leftoverHtml = `
        <div class="leftover-panel">
          <h3>${esc(CONFIG.texts.leftoverTitle)}</h3>
          <p class="leftover-intro">${esc(CONFIG.texts.leftoverIntro)}</p>
          ${offers.length ? offers.map(o=>`
            <div class="leftover-item">
              <span>${esc(o.label)}</span>
              <button data-action="buy-extra" data-feature="${o.id}" data-price="${o.price}">Add — ${o.price} pts</button>
            </div>`).join("") : `<div class="basket-empty">${esc(CONFIG.texts.leftoverNone)}</div>`}
        </div>`;
    }

    endEl.innerHTML = `
      ${leftoverHtml}
      <div class="end-panel">
        <h3>Before you defend</h3>
        ${CONFIG.texts.reflectPrompts.map((q,i)=>`
          <div class="reflect-q">
            <label>${i+1}. ${esc(q)}</label>
            <textarea data-action="reflect" data-key="${i===0?'hardest':'refused'}">${esc(i===0?teamState.reflections.hardest:teamState.reflections.refused)}</textarea>
          </div>`).join("")}
        <div class="takeaway-wallet">${esc(CONFIG.texts.takeaway)}</div>
        <div class="bridge-wallet">${esc(CONFIG.texts.bridge)}</div>
      </div>`;
    endEl.querySelectorAll('[data-action="reflect"]').forEach(ta=>{
      ta.addEventListener("input", ()=>{
        const t = loadTeam(teamId);
        t.reflections[ta.getAttribute("data-key")] = ta.value;
        saveTeam(teamId, t);
      });
    });
  }
}

function walletDelegatedClick(e){
  const teamId = getActiveTeamId();
  if(!teamId) return;
  const el = e.target.closest("[data-action]");
  if(!el) return;

  // Advancing to the next feature in the wallet stepper (no data-feature).
  if(el.getAttribute("data-action") === "next-feature"){
    const t = loadTeam(teamId);
    t.walletIndex = Math.min((t.walletIndex || 0) + 1, orderedFeatures().length);
    saveTeam(teamId, t);
    updateMeter(teamId);
    renderCards(teamId);
    renderBasket(teamId);
    const w = document.querySelector(".wallet");
    if(w) w.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }

  if(!el.getAttribute("data-feature")) return;
  const action = el.getAttribute("data-action");
  const featureId = el.getAttribute("data-feature");
  const f = CONFIG.features.find(x => x.id === featureId);
  const teamState = loadTeam(teamId);
  const remaining = CONFIG.meta.budget - spentFor(teamState);

  // Once a team is out of the market, no more buying of any kind.
  if(teamState.eliminated) return;

  if(action === "buy-extra"){
    const price = Number(el.getAttribute("data-price"));
    if(price > remaining) return; // safety: never overspend in the bonus round
    const offer = leftoverOffers(teamState, remaining).find(o => o.id === featureId);
    teamState.decisions[featureId] = { status:"bought", label: (offer ? offer.label : f.name), price: price, lesson: f.lesson };

  } else if(action === "buy"){
    // no-option features (none / trap) go straight to the lesson step;
    // mandatory features open the version picker first.
    if(f.forkType === "mandatory"){
      teamState.decisions[featureId] = { status:"staging", stage:"options" };
    } else {
      teamState.decisions[featureId] = { status:"staging", stage:"lesson", pendingLabel: f.name, pendingPrice: f.sticker };
    }

  } else if(action === "pick-branch"){
    const idx = Number(el.getAttribute("data-branch"));
    const b = f.branches[idx];
    if(typeof b.price === "number" && b.price > remaining) return;
    teamState.decisions[featureId] = { status:"staging", stage:"lesson", pendingLabel: f.name + ": " + b.label, pendingPrice: b.price, branchIdx: idx };

  } else if(action === "pick-tier"){
    const idx = Number(el.getAttribute("data-tier"));
    const t = f.tiers[idx];
    if(!t.free && t.price > remaining) return;
    teamState.decisions[featureId] = { status:"staging", stage:"lesson", pendingLabel: f.name + ": " + t.label, pendingPrice: t.free ? 0 : t.price, tierIdx: idx };

  } else if(action === "pick-blind"){
    const idx = Number(el.getAttribute("data-opt"));
    teamState.decisions[featureId] = { status:"staging", stage:"lesson", pendingLabel: f.name + ": " + f.options[idx].teaser, optIdx: idx };

  } else if(action === "lesson"){
    // "What's the lesson?" — commit the purchase and reveal the consequence.
    const cur = teamState.decisions[featureId] || {};
    let price, label, reveal = "";
    if(f.forkType === "none"){
      price = f.sticker; label = f.name; reveal = f.revealText;
    } else if(f.forkType === "mandatory"){
      const b = f.branches[cur.branchIdx];
      price = b.price; label = f.name + ": " + b.label; reveal = f.revealText;
    } else if(f.forkType === "ladder"){
      const t = f.tiers[cur.tierIdx];
      price = t.free ? 0 : (t.price + (t.secretExtra || 0));
      label = f.name + ": " + t.label;
      reveal = t.secretNote || "";
    } else if(f.forkType === "trap"){
      price = (typeof f.realPrice === "number" ? f.realPrice : f.sticker);
      label = f.name;
      reveal = f.trapReveal;
    } else if(f.forkType === "blind"){
      const o = f.options[cur.optIdx];
      price = o.revealPrice; label = f.name + ": " + o.revealLabel;
      reveal = "You got: " + o.revealLabel + " · You paid " + o.revealPrice + " pts";
    }
    teamState.decisions[featureId] = { status:"bought", label, price, reveal, lesson: f.lesson };

  } else if(action === "skip"){
    const isTrap = f.forkType === "trap";
    teamState.decisions[featureId] = isTrap
      ? { status:"skipped", label: f.name + " — you spotted the limit in advance", saved: 0, displayAmt: "Spotted the limit", lesson: f.lesson, praise: "Nice — you recognized the limit before trying to buy." }
      : { status:"skipped", label: f.name + " — skipped", saved: (typeof f.sticker === "number" ? f.sticker : 0), lesson: f.lesson };

  } else {
    return;
  }

  // Stamp acquisition order on new purchases (used to know which feature
  // is "the last one acquired" if the budget rule kicks in).
  const dNow = teamState.decisions[featureId];
  if(dNow && dNow.status === "bought" && dNow.seq == null){
    teamState.seq = (teamState.seq || 0) + 1;
    dNow.seq = teamState.seq;
  }
  enforceBudget(teamState);

  saveTeam(teamId, teamState);
  updateMeter(teamId);
  renderCards(teamId);
  renderBasket(teamId);
  const cardEl = document.querySelector(`[data-feature="${featureId}"]`);
  if(cardEl){ cardEl.classList.add("just-changed"); setTimeout(()=>cardEl.classList.remove("just-changed"), 700); }
}
</script>
</body>
</html>
